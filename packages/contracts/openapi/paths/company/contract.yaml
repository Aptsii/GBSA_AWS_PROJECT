paths:
  /me:
    get:
      operationId: getCurrentCompanyUser
      x-owner-lane: A
      tags:
      - Company
      security:
      - CompanyBearer: []
      responses:
        '200':
          description: Authenticated company user and tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyUserView'
        default:
          $ref: '#/components/responses/Error'
  /positions:
    get:
      operationId: listPositions
      x-owner-lane: A
      tags:
      - Hiring
      security:
      - CompanyBearer: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tenant-scoped positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createPosition
      x-owner-lane: A
      tags:
      - Hiring
      security:
      - CompanyBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionCreate'
      responses:
        '201':
          description: Position created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'
        default:
          $ref: '#/components/responses/Error'
  /positions/{position_id}/competency-model-versions:
    post:
      operationId: createCompetencyModelVersion
      x-owner-lane: A
      tags:
      - Hiring
      security:
      - CompanyBearer: []
      parameters:
      - $ref: '#/components/parameters/PositionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompetencyModelVersionCreate'
      responses:
        '201':
          description: Immutable draft version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetencyModelVersion'
        default:
          $ref: '#/components/responses/Error'
  /competency-model-versions/{version_id}/publish:
    post:
      operationId: publishCompetencyModelVersion
      x-owner-lane: A
      tags:
      - Hiring
      security:
      - CompanyBearer: []
      parameters:
      - $ref: '#/components/parameters/VersionId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: Published immutable criterion version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetencyModelVersion'
        default:
          $ref: '#/components/responses/Error'
  /campaigns:
    post:
      operationId: createCampaign
      x-owner-lane: A
      tags:
      - Hiring
      security:
      - CompanyBearer: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
  /campaigns/{campaign_id}/publish:
    post:
      operationId: publishCampaign
      x-owner-lane: A
      tags:
      - Hiring
      security:
      - CompanyBearer: []
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatchVersion'
      responses:
        '200':
          description: Published campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        default:
          $ref: '#/components/responses/Error'
  /campaigns/{campaign_id}/invitations:
    get:
      operationId: listInvitations
      x-owner-lane: A
      tags:
      - Hiring
      security:
      - CompanyBearer: []
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Invitations and progress projections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPage'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createInvitations
      x-owner-lane: A
      tags:
      - Hiring
      security:
      - CompanyBearer: []
      parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationBatchCreate'
      responses:
        '202':
          description: Invitations accepted for issuance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationBatchResult'
        default:
          $ref: '#/components/responses/Error'
  /applicant/access/exchange:
    post:
      operationId: exchangeApplicantInvitationToken
      x-owner-lane: A
      tags:
      - Applicant Access
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicantTokenExchange'
      responses:
        '204':
          description: 'Scoped, expiring HttpOnly session cookie set. Raw invitation token is not returned.

            '
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /applicant/identity-verifications:
    post:
      operationId: verifyApplicantIdentity
      x-owner-lane: A
      tags:
      - Applicant Access
      security:
      - ApplicantSession: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicantIdentityVerification'
      responses:
        '200':
          description: Verified applicant access state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicantAccessState'
        default:
          $ref: '#/components/responses/Error'
  /applicant/consents:
    post:
      operationId: recordApplicantConsent
      x-owner-lane: A
      tags:
      - Applicant Access
      security:
      - ApplicantSession: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentCreate'
      responses:
        '201':
          description: Immutable consent record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentView'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    CompanyBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApplicantSession:
      type: apiKey
      in: cookie
      name: iep_applicant_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatchVersion:
      name: If-Match-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PositionId:
      name: position_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportItemId:
      name: report_item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Structured error response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - request_id
      - retryable
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
        current_version:
          type: integer
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - code
            properties:
              field:
                type: string
              code:
                type: string
    CompanyUserView:
      type: object
      additionalProperties: false
      required:
      - company_user_id
      - company_id
      - email
      - status
      properties:
        company_user_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - invited
          - active
          - disabled
    PositionCreate:
      type: object
      additionalProperties: false
      required:
      - title
      - description
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 20000
    Position:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/PositionCreate'
      - type: object
        required:
        - position_id
        - status
        - row_version
        - created_at
        properties:
          position_id:
            type: string
            format: uuid
          status:
            type: string
            enum:
            - draft
            - active
            - closed
          row_version:
            type: integer
            minimum: 1
          created_at:
            type: string
            format: date-time
    PositionPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Position'
        next_cursor:
          type:
          - string
          - 'null'
    EvaluationCriterionInput:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      - description
      - weight
      - good_evidence
      - weak_evidence
      - abstain_guidance
      - required
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_-]{2,40}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 4000
        weight:
          type: number
          minimum: 0
        good_evidence:
          type: object
        weak_evidence:
          type: object
        abstain_guidance:
          type: string
          minLength: 1
        common_questions:
          type: array
          items:
            type: string
        required:
          type: boolean
    CompetencyModelVersionCreate:
      type: object
      additionalProperties: false
      required:
      - criteria
      - prohibited_topics
      - interview_duration_minutes
      - persona_definition
      properties:
        criteria:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EvaluationCriterionInput'
        prohibited_topics:
          type: array
          items:
            type: string
        interview_duration_minutes:
          type: integer
          minimum: 10
          maximum: 120
        persona_definition:
          type: object
    CompetencyModelVersion:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/CompetencyModelVersionCreate'
      - type: object
        required:
        - competency_model_version_id
        - position_id
        - version_number
        - status
        - row_version
        properties:
          competency_model_version_id:
            type: string
            format: uuid
          position_id:
            type: string
            format: uuid
          version_number:
            type: integer
            minimum: 1
          status:
            type: string
            enum:
            - draft
            - published
            - retired
          row_version:
            type: integer
            minimum: 1
          published_at:
            type:
            - string
            - 'null'
            format: date-time
    CampaignCreate:
      type: object
      additionalProperties: false
      required:
      - position_id
      - competency_model_version_id
      - name
      - candidate_instructions
      properties:
        position_id:
          type: string
          format: uuid
        competency_model_version_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        candidate_instructions:
          type: string
          minLength: 1
          maxLength: 10000
    Campaign:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/CampaignCreate'
      - type: object
        required:
        - campaign_id
        - status
        - row_version
        properties:
          campaign_id:
            type: string
            format: uuid
          status:
            type: string
            enum:
            - draft
            - published
            - closed
          row_version:
            type: integer
            minimum: 1
          published_at:
            type:
            - string
            - 'null'
            format: date-time
    InvitationBatchCreate:
      type: object
      additionalProperties: false
      required:
      - applicants
      - expires_at
      properties:
        applicants:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required:
            - email
            - display_name
            properties:
              email:
                type: string
                format: email
              display_name:
                type: string
                minLength: 1
                maxLength: 200
        expires_at:
          type: string
          format: date-time
    InvitationView:
      type: object
      additionalProperties: false
      required:
      - invitation_id
      - campaign_id
      - applicant_email
      - status
      - expires_at
      - row_version
      properties:
        invitation_id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        applicant_email:
          type: string
          format: email
        status:
          type: string
          enum:
          - invited
          - identity_verified
          - consented
          - materials_submitted
          - analyzing
          - ready
          - interviewing
          - interrupted
          - completed
          - reviewed
          - expired
          - revoked
          - deleted
        expires_at:
          type: string
          format: date-time
        row_version:
          type: integer
          minimum: 1
        analysis_status:
          type:
          - string
          - 'null'
        interview_status:
          type:
          - string
          - 'null'
        report_status:
          type:
          - string
          - 'null'
    InvitationPage:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvitationView'
        next_cursor:
          type:
          - string
          - 'null'
    InvitationBatchResult:
      type: object
      additionalProperties: false
      required:
      - accepted_count
      - rejected_count
      - invitations
      properties:
        accepted_count:
          type: integer
          minimum: 0
        rejected_count:
          type: integer
          minimum: 0
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/InvitationView'
    ApplicantTokenExchange:
      type: object
      additionalProperties: false
      required:
      - invitation_token
      properties:
        invitation_token:
          type: string
          minLength: 32
          maxLength: 4096
    ApplicantIdentityVerification:
      type: object
      additionalProperties: false
      required:
      - display_name
      - verification_value
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 200
        verification_value:
          type: string
          minLength: 1
          maxLength: 500
    ApplicantAccessState:
      type: object
      additionalProperties: false
      required:
      - invitation_id
      - state
      - expires_at
      - required_actions
      properties:
        invitation_id:
          type: string
          format: uuid
        state:
          type: string
        expires_at:
          type: string
          format: date-time
        required_actions:
          type: array
          items:
            type: string
    ConsentCreate:
      type: object
      additionalProperties: false
      required:
      - policy_version
      - accepted_purposes
      - consent_content_digest
      properties:
        policy_version:
          type: string
        accepted_purposes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
            - document_analysis
            - recording
            - ai_assessment
        consent_content_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
    ConsentView:
      type: object
      additionalProperties: false
      required:
      - consent_record_id
      - policy_version
      - accepted_purposes
      - retention_days
      - accepted_at
      properties:
        consent_record_id:
          type: string
          format: uuid
        policy_version:
          type: string
        accepted_purposes:
          type: array
          items:
            type: string
        retention_days:
          type: integer
          minimum: 1
        accepted_at:
          type: string
          format: date-time
