[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
path_separator = newline
version_locations =
    %(here)s/alembic/versions/company
    %(here)s/alembic/versions/submission
    %(here)s/alembic/versions/interview
    %(here)s/alembic/versions/reporting
sqlalchemy.url = postgresql+psycopg://interview:interview_local@localhost:5432/interview_evidence

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
